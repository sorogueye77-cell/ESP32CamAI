name: Build Android APK

on:
  workflow_dispatch:  # Permet de lancer manuellement
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout du code
      uses: actions/checkout@v3
      
    - name: Configuration de JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Accorder les permissions d'exécution à gradlew
      run: |
        cd ESP32CamAI_android
        chmod +x gradlew
        
    - name: Build avec Gradle
      run: |
        cd ESP32CamAI_android
        ./gradlew assembleDebug --stacktrace
        
    - name: Upload de l'APK
      uses: actions/upload-artifact@v3
      with:
        name: app-debug
        path: ESP32CamAI_android/app/build/outputs/apk/debug/app-debug.apk
