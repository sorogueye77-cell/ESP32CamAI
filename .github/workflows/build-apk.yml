name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout du code
      uses: actions/checkout@v4
      
    - name: Configuration de JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Mettre à jour Gradle Wrapper et corriger le code
      run: |
        cd ESP32CamAI_android
        
        # Mettre à jour Gradle
        sed -i 's/gradle-5.4.1-all.zip/gradle-6.9.4-all.zip/g' gradle/wrapper/gradle-wrapper.properties
        
        # Corriger TensorFlow Lite dans build.gradle
        if [ -f "ESP32CamAI/build.gradle" ]; then
          sed -i "s/org.tensorflow:tensorflow-lite:0.0.0-nightly/org.tensorflow:tensorflow-lite:2.8.0/g" ESP32CamAI/build.gradle
          sed -i "s/org.tensorflow:tensorflow-lite-gpu:0.0.0-nightly/org.tensorflow:tensorflow-lite-gpu:2.8.0/g" ESP32CamAI/build.gradle
          sed -i "s/compile /implementation /g" ESP32CamAI/build.gradle
        fi
        
        # Remplacer jcenter par mavenCentral
        find . -name "build.gradle" -type f -exec sed -i 's/jcenter()/mavenCentral()/g' {} \;
        
        # Corriger les appels API TensorFlow Lite dans les fichiers Java
        # Fichier 1: TFLiteObjectDetectionSSDAPIModel.java
        sed -i 's/tfLiteSSD\.setNumThreads(num_threads)/\/\/ tfLiteSSD.setNumThreads(num_threads) \/\/ API deprecated/g' ESP32CamAI/src/main/java/com/p4f/esp32camai/tflite/TFLiteObjectDetectionSSDAPIModel.java
        sed -i 's/tfLiteSSD\.setUseNNAPI(isChecked)/\/\/ tfLiteSSD.setUseNNAPI(isChecked) \/\/ API deprecated/g' ESP32CamAI/src/main/java/com/p4f/esp32camai/tflite/TFLiteObjectDetectionSSDAPIModel.java
        
        # Fichier 2: TFLiteObjectDetectionAPIModel.java
        sed -i 's/tfLiteYolo\.setNumThreads(num_threads)/\/\/ tfLiteYolo.setNumThreads(num_threads) \/\/ API deprecated/g' ESP32CamAI/src/main/java/com/p4f/esp32camai/tflite/TFLiteObjectDetectionAPIModel.java
        sed -i 's/tfLiteYolo\.setUseNNAPI(isChecked)/\/\/ tfLiteYolo.setUseNNAPI(isChecked) \/\/ API deprecated/g' ESP32CamAI/src/main/java/com/p4f/esp32camai/tflite/TFLiteObjectDetectionAPIModel.java
        
        # Fichier 3: TFLiteSegmentationAPIModel.java
        sed -i 's/tfLiteSeg\.setNumThreads(num_threads)/\/\/ tfLiteSeg.setNumThreads(num_threads) \/\/ API deprecated/g' ESP32CamAI/src/main/java/com/p4f/esp32camai/tflite/TFLiteSegmentationAPIModel.java
        sed -i 's/tfLiteSeg\.setUseNNAPI(isChecked)/\/\/ tfLiteSeg.setUseNNAPI(isChecked) \/\/ API deprecated/g' ESP32CamAI/src/main/java/com/p4f/esp32camai/tflite/TFLiteSegmentationAPIModel.java
        
    - name: Vérifier les modifications
      run: |
        cd ESP32CamAI_android
        echo "=== Vérification des corrections ==="
        grep -n "setNumThreads\|setUseNNAPI" ESP32CamAI/src/main/java/com/p4f/esp32camai/tflite/*.java || echo "Méthodes dépréciées commentées avec succès"
        
    - name: Accorder les permissions d'exécution à gradlew
      run: |
        cd ESP32CamAI_android
        chmod +x gradlew
        
    - name: Nettoyer le cache Gradle
      run: |
        cd ESP32CamAI_android
        ./gradlew clean || true
        
    - name: Build avec Gradle
      run: |
        cd ESP32CamAI_android
        ./gradlew assembleDebug --stacktrace --no-daemon
        
    - name: Upload de l'APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ESP32CamAI_android/ESP32CamAI/build/outputs/apk/debug/*.apk
