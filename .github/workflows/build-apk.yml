name: Build Android APK

on:
  workflow_dispatch:  # Permet de lancer manuellement
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout du code
      uses: actions/checkout@v4
      
    - name: Configuration de JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Mettre à jour Gradle Wrapper et dépendances
      run: |
        cd ESP32CamAI_android
        # Mettre à jour Gradle vers version compatible
        sed -i 's/gradle-5.4.1-all.zip/gradle-6.9.4-all.zip/g' gradle/wrapper/gradle-wrapper.properties
        
        # Corriger la version de TensorFlow Lite dans build.gradle
        if [ -f "build.gradle" ]; then
          sed -i "s/org.tensorflow:tensorflow-lite:0.0.0-nightly/org.tensorflow:tensorflow-lite:2.8.0/g" build.gradle
        fi
        
        # Vérifier aussi dans app/build.gradle
        if [ -f "app/build.gradle" ]; then
          sed -i "s/org.tensorflow:tensorflow-lite:0.0.0-nightly/org.tensorflow:tensorflow-lite:2.8.0/g" app/build.gradle
        fi
        
        # Mettre à jour les repositories si nécessaire
        find . -name "build.gradle" -type f -exec sed -i 's/jcenter()/mavenCentral()/g' {} \;
        
    - name: Afficher les modifications (debug)
      run: |
        cd ESP32CamAI_android
        echo "=== Contenu de build.gradle ==="
        cat build.gradle || echo "Pas de build.gradle à la racine"
        echo "=== Contenu de app/build.gradle ==="
        cat app/build.gradle || echo "Pas de app/build.gradle"
        
    - name: Accorder les permissions d'exécution à gradlew
      run: |
        cd ESP32CamAI_android
        chmod +x gradlew
        
    - name: Nettoyer le cache Gradle
      run: |
        cd ESP32CamAI_android
        ./gradlew clean || true
        
    - name: Build avec Gradle
      run: |
        cd ESP32CamAI_android
        ./gradlew assembleDebug --stacktrace --no-daemon
        
    - name: Upload de l'APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ESP32CamAI_android/app/build/outputs/apk/debug/app-debug.apk
