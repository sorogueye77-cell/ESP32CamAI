name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout du code
      uses: actions/checkout@v4
      
    - name: Configuration de JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Créer le script de correction
      run: |
        cat > fix_tflite.py << 'EOF'
        import re
        import sys
        
        def fix_java_file(filepath):
            with open(filepath, 'r') as f:
                content = f.read()
            
            # Remplacer setNumThreads (avec ou sans espaces)
            content = re.sub(
                r'if\s*\((\w+)\s*!=\s*null\)\s*\1\.setNumThreads\(num_threads\);',
                r'if (\1 != null) { /* \1.setNumThreads(num_threads); // API deprecated */ }',
                content
            )
            
            # Remplacer setUseNNAPI (avec ou sans espaces)
            content = re.sub(
                r'if\s*\((\w+)\s*!=\s*null\)\s*\1\.setUseNNAPI\(isChecked\);',
                r'if (\1 != null) { /* \1.setUseNNAPI(isChecked); // API deprecated */ }',
                content
            )
            
            with open(filepath, 'w') as f:
                f.write(content)
            
            print(f"Fixed: {filepath}")
        
        if __name__ == '__main__':
            for filepath in sys.argv[1:]:
                try:
                    fix_java_file(filepath)
                except Exception as e:
                    print(f"Error fixing {filepath}: {e}")
                    sys.exit(1)
        EOF
        
    - name: Mettre à jour Gradle et dépendances
      run: |
        cd ESP32CamAI_android
        
        # Mettre à jour Gradle
        sed -i 's/gradle-5.4.1-all.zip/gradle-6.9.4-all.zip/g' gradle/wrapper/gradle-wrapper.properties
        
        # Corriger TensorFlow Lite dans build.gradle
        if [ -f "ESP32CamAI/build.gradle" ]; then
          sed -i "s/org.tensorflow:tensorflow-lite:0.0.0-nightly/org.tensorflow:tensorflow-lite:2.8.0/g" ESP32CamAI/build.gradle
          sed -i "s/org.tensorflow:tensorflow-lite-gpu:0.0.0-nightly/org.tensorflow:tensorflow-lite-gpu:2.8.0/g" ESP32CamAI/build.gradle
          sed -i "s/compile /implementation /g" ESP32CamAI/build.gradle
        fi
        
        # Remplacer jcenter par mavenCentral
        find . -name "build.gradle" -type f -exec sed -i 's/jcenter()/mavenCentral()/g' {} \;
        
    - name: Corriger les fichiers Java TensorFlow Lite
      run: |
        cd ESP32CamAI_android
        python3 ../fix_tflite.py \
          ESP32CamAI/src/main/java/com/p4f/esp32camai/tflite/TFLiteObjectDetectionSSDAPIModel.java \
          ESP32CamAI/src/main/java/com/p4f/esp32camai/tflite/TFLiteObjectDetectionAPIModel.java \
          ESP32CamAI/src/main/java/com/p4f/esp32camai/tflite/TFLiteSegmentationAPIModel.java
        
    - name: Vérifier les modifications
      run: |
        cd ESP32CamAI_android
        echo "=== Vérification TFLiteObjectDetectionSSDAPIModel.java ==="
        grep -A2 -B2 "setNumThreads\|setUseNNAPI" ESP32CamAI/src/main/java/com/p4f/esp32camai/tflite/TFLiteObjectDetectionSSDAPIModel.java || echo "OK"
        echo ""
        echo "=== Vérification TFLiteObjectDetectionAPIModel.java ==="
        grep -A2 -B2 "setNumThreads\|setUseNNAPI" ESP32CamAI/src/main/java/com/p4f/esp32camai/tflite/TFLiteObjectDetectionAPIModel.java || echo "OK"
        
    - name: Accorder les permissions d'exécution à gradlew
      run: |
        cd ESP32CamAI_android
        chmod +x gradlew
        
    - name: Nettoyer le cache Gradle
      run: |
        cd ESP32CamAI_android
        ./gradlew clean || true
        
    - name: Build avec Gradle
      run: |
        cd ESP32CamAI_android
        ./gradlew assembleDebug --stacktrace --no-daemon
        
    - name: Lister les APK générés
      run: |
        echo "=== APK générés ==="
        find ESP32CamAI_android -name "*.apk" -type f
        
    - name: Upload de l'APK
      uses: actions/upload-artifact@v4
      with:
        name: ESP32CamAI-debug-apk
        path: ESP32CamAI_android/**/build/outputs/apk/debug/*.apk
